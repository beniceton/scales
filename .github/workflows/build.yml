name: Build and release

on:
  push:
    branches: [main]
    paths: ["src/**", "clips/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mutagen
      - name: Unpack clips.zip if one was uploaded
        run: |
          if [ -f clips.zip ]; then unzip -o -q clips.zip && git rm -q --cached clips.zip && rm -f clips.zip; fi
      - name: Generate any missing narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 src/generate.py
      - name: Build index.html
        run: python3 src/build.py
      - name: Commit the build
        run: |
          git config user.name "scales-bot"
          git config user.email "scales-bot@users.noreply.github.com"
          git add clips index.html
          git commit -m "Build $(date -u +%Y%m%d-%H%M) [skip ci]" || echo "nothing to commit"
          git push
